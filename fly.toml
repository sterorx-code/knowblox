# fly.toml app configuration file generated for knowblox on 2026-06-02T00:21:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'knowblox'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 79
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
